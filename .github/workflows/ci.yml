name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_MODE: fixture
      ANALYZER_MODE: rule
      TRADING_MODE: paper
      RENDER_CHARTS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --select E9,F

      - name: Tests
        run: pytest --cov

      - name: CLI smoke
        run: |
          python -m coach_miranda_miner doctor
          python -m coach_miranda_miner backtest --symbol BTC/USD --timeframe 1h

      - name: Dashboard import smoke
        run: python -c "from coach_miranda_miner.dashboard import main; print('dashboard import ok')"
