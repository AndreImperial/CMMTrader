name: CMMTrader Telegram Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: cmmtrader-telegram-alerts
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_MODE: coinbase
      QUOTE_CURRENCY: USD
      ANALYZER_MODE: rule
      DISCOVERY_MODE: exchange
      TRADING_MODE: paper
      RENDER_CHARTS: "false"
      DISCOVERY_LIMIT: "100"
      DISCOVERY_POOL_LIMIT: "250"
      PREFILTER_LIMIT: "100"
      DEEP_SCAN_LIMIT: "20"
      TELEGRAM_MIN_SIGNAL: watch
      ALERT_COOLDOWN_MINUTES: "180"
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run alert scan
        run: python -m coach_miranda_miner scan
