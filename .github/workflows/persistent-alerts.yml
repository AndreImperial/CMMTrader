name: CMMTrader Persistent Alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Scanner mode"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - scalp
          - intraday

concurrency:
  group: cmmtrader-persistent-alerts
  cancel-in-progress: true

jobs:
  alert-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_MODE: coinbase
      QUOTE_CURRENCY: USD
      ANALYZER_MODE: rule
      DISCOVERY_MODE: exchange
      TRADING_MODE: paper
      RENDER_CHARTS: "false"
      DISCOVERY_LIMIT: "100"
      PREFILTER_LIMIT: "100"
      DEEP_SCAN_LIMIT: "20"
      SCALP_SCAN_LIMIT: "50"
      SCAN_WORKERS: "8"
      FETCH_TIMEOUT_SECONDS: "20"
      PREFILTER_CANDLE_LIMIT: "40"
      SCALP_CANDLE_LIMIT: "240"
      TELEGRAM_MIN_SIGNAL: enter
      MIN_ALERT_GRADE: B
      ALERT_COOLDOWN_MINUTES: "180"
      SCALP_ALERT_COOLDOWN_MINUTES: "45"
      JOURNAL_DB: .cache/cmm-alert-journal.sqlite3
      DASHBOARD_URL: https://cmmtrader.onrender.com
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore alert journal
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: cmm-alert-journal-${{ github.run_id }}
          restore-keys: |
            cmm-alert-journal-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled alert scan
        run: |
          mkdir -p .cache
          MODE="${{ github.event.inputs.scan_mode || 'both' }}"
          python -m coach_miranda_miner alert-once --mode "$MODE"

      - name: Save alert journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: cmm-alert-journal-${{ github.run_id }}
