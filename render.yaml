services:
  - type: web
    name: cmmtrader
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: DATA_MODE
        value: coinbase
      - key: QUOTE_CURRENCY
        value: USD
      - key: ANALYZER_MODE
        value: rule
      - key: DISCOVERY_MODE
        value: exchange
      - key: TRADING_MODE
        value: paper
      - key: RENDER_CHARTS
        value: false
      - key: OI_LIMIT
        value: "8"
      - key: MIN_CONFIDENCE
        value: "0.72"
      - key: MIN_RISK_REWARD
        value: "2.0"
      - key: TELEGRAM_MIN_SIGNAL
        value: enter
      - key: ALERT_COOLDOWN_MINUTES
        value: "180"
      # Optional keys for better derivatives data:
      # - key: COINALYZE_API_KEY
      #   sync: false
      # - key: COINGLASS_API_KEY
      #   sync: false
